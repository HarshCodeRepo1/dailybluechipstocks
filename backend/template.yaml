AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DailyBlueChipStocks backend with Cognito, preferences, cached market data, and newsletters.

Parameters:
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_gfVsnIELk

  CognitoAppClientId:
    Type: String
    Default: 71osdnkvspv2fgoeirmm6fmee6

  FrontendOrigin:
    Type: String
    Default: http://localhost:5173

  MarketstackSecretId:
    Type: String
    Default: dailybluechipstocks/marketstack

  NewsletterFromEmail:
    Type: String
    Default: newsletter@dailybluechipstocks.com

  MarketSymbols:
    Type: String
    Default: AAPL,MSFT,NVDA,GOOGL,AMZN,META,AVGO,ORCL,CRM,ADBE,LLY,JNJ,PFE,MRK,ABBV,XOM,CVX,COP,JPM,BAC,GS,V,MA,WMT,COST,HD,KO,PEP,CAT,GE

Resources:
  DailyBlueChipApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - PUT
          - POST
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience:
                - !Ref CognitoAppClientId

  UserPreferencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  MarketSignalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  MarketHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: marketDate
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
        - AttributeName: marketDate
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  MarketIngestionRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runKey
          AttributeType: S
      KeySchema:
        - AttributeName: runKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  NewsletterRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runKey
          AttributeType: S
      KeySchema:
        - AttributeName: runKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  MarketRawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawSnapshots
            Status: Enabled
            ExpirationInDays: 400

  GetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      CodeUri: src/getMe/
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /me
            Method: GET

  PreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      CodeUri: src/preferences/
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          USER_PREFERENCES_TABLE: !Ref UserPreferencesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserPreferencesTable
      Events:
        GetPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /preferences
            Method: GET
        PutPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /preferences
            Method: PUT

  MarketViewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      CodeUri: src/marketView/
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          MARKET_SIGNALS_TABLE: !Ref MarketSignalsTable
          USER_PREFERENCES_TABLE: !Ref UserPreferencesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MarketSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserPreferencesTable
      Events:
        GetMarket:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /market
            Method: GET
        GetPublicMarket:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /market/public
            Method: GET
            Auth:
              Authorizer: NONE

  NewsletterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      CodeUri: src/newsletter/
      Handler: index.handler
      MemorySize: 256
      Timeout: 120
      Environment:
        Variables:
          MARKET_SIGNALS_TABLE: !Ref MarketSignalsTable
          USER_PREFERENCES_TABLE: !Ref UserPreferencesTable
          NEWSLETTER_RUNS_TABLE: !Ref NewsletterRunsTable
          USER_POOL_ID: !Ref CognitoUserPoolId
          NEWSLETTER_FROM_EMAIL: !Ref NewsletterFromEmail
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MarketSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserPreferencesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NewsletterRunsTable
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:ListUsers
            Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource: "*"
      Events:
        AdminNewsletterPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /admin/newsletter/preview
            Method: POST
        AdminNewsletterTest:
          Type: HttpApi
          Properties:
            ApiId: !Ref DailyBlueChipApi
            Path: /admin/newsletter/test
            Method: POST

        # Production code is deployed, but the schedule is intentionally OFF.
        # Enable this only after SES/domain verification and test-email approval.
        ProductionNewsletter:
          Type: ScheduleV2
          Properties:
            Description: Daily production newsletter after the close.
            ScheduleExpression: cron(30 18 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            State: DISABLED
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 300
            Input: '{"mode":"PRODUCTION"}'

  HistoryBootstrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      CodeUri: src/historyBootstrap/
      Handler: index.handler
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          MARKETSTACK_SECRET_ID: !Ref MarketstackSecretId
          MARKET_SYMBOLS: !Ref MarketSymbols
          MARKET_RAW_BUCKET: !Ref MarketRawBucket
          MARKET_SIGNALS_TABLE: !Ref MarketSignalsTable
          MARKET_HISTORY_TABLE: !Ref MarketHistoryTable
          MARKET_INGESTION_RUNS_TABLE: !Ref MarketIngestionRunsTable
          SIGNAL_THRESHOLD_PERCENT: "1"
          BOOTSTRAP_CHUNK_DAYS: "28"
      Policies:
        - S3WritePolicy:
            BucketName: !Ref MarketRawBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketSignalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketIngestionRunsTable
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dailybluechipstocks/marketstack-*

  MarketIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      CodeUri: src/marketIngest/
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          MARKETSTACK_SECRET_ID: !Ref MarketstackSecretId
          MARKET_SYMBOLS: !Ref MarketSymbols
          MARKET_RAW_BUCKET: !Ref MarketRawBucket
          MARKET_SIGNALS_TABLE: !Ref MarketSignalsTable
          MARKET_HISTORY_TABLE: !Ref MarketHistoryTable
          MARKET_INGESTION_RUNS_TABLE: !Ref MarketIngestionRunsTable
          SIGNAL_THRESHOLD_PERCENT: "1"
      Policies:
        - S3WritePolicy:
            BucketName: !Ref MarketRawBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketSignalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketHistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketIngestionRunsTable
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:dailybluechipstocks/marketstack-*
      Events:
        MiddayMarketRefresh:
          Type: ScheduleV2
          Properties:
            Description: One Marketstack bulk request around midday on weekdays.
            ScheduleExpression: cron(30 12 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 300
            Input: '{"mode":"MIDDAY"}'
        ClosingMarketRefresh:
          Type: ScheduleV2
          Properties:
            Description: One Marketstack bulk EOD request after market close on weekdays.
            ScheduleExpression: cron(30 17 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            FlexibleTimeWindow:
              Mode: "OFF"
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 300
            Input: '{"mode":"CLOSE"}'

Outputs:
  ApiUrl:
    Description: Base URL for the DailyBlueChipStocks API.
    Value: !Sub https://${DailyBlueChipApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  UserPreferencesTableName:
    Description: DynamoDB table used to store authenticated user preferences.
    Value: !Ref UserPreferencesTable

  MarketSignalsTableName:
    Description: Latest cached market data used by the site and newsletter.
    Value: !Ref MarketSignalsTable

  MarketHistoryTableName:
    Description: Daily EOD observations accumulated without extra frontend API calls.
    Value: !Ref MarketHistoryTable

  MarketRawBucketName:
    Description: Private S3 bucket containing raw Marketstack snapshots.
    Value: !Ref MarketRawBucket

  NewsletterRunsTableName:
    Description: Idempotency records for production newsletter sends.
    Value: !Ref NewsletterRunsTable
